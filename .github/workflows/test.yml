# Keep Windows checkout compatible with the example asset paths.
name: Build and verify
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable Git long paths on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/dsh/package-lock.json
      - run: npm ci --prefix src/dsh
      - run: git diff --exit-code -- src/dsh/client/client.js
      - if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        run: python -m pip install ruff==0.11.13
      - if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        run: python -m ruff check src
      - name: Install benchmark workflows
        run: python -m pip install -e ".[dsh,production,research]"
      - name: Python behavior contracts
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
      - name: Emit Python failure tail
        if: failure() && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'src'
          $output = & python -m unittest discover -s tests -v 2>&1 | Out-String
          $message = $output.Substring([Math]::Max(0, $output.Length - 12000))
          $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::error title=Python behavior contracts::$message"
          exit 1
      - name: DSH behavior contracts
        run: node --test "src/dsh/**/*.test.mjs" "src/ui/**/*.test.mjs"
      - run: benchforge --help
      - if: matrix.python == '3.12'
        run: python -m server.http_api --help
